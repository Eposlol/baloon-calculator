<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор печати на шарах</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css">
</head>

<body>
  <div class="page">
    <header class="page__header">
      <h1 class="page__title">Калькулятор печати на шарах</h1>
      <span class="page__subtitle">Латексные шары 30&nbsp;см (12″)</span>
    </header>

    <!-- ===== Блок калькулятора ===== -->
    <div class="calc" id="calc">
      <div class="calc__grid">

        <!-- Превью шара -->
        <div class="calc__preview">
          <div class="balloon">
            <div class="balloon__shadow">
              <div class="balloon__body" id="balloon-body">
                <div class="balloon__highlight"></div>
                <div class="balloon__print">
                  <svg class="balloon__logo balloon__logo--front" id="logo-front-el" viewBox="0 0 3417.41 2684.48">
                    <use href="#logo-front"></use>
                  </svg>
                  <svg class="balloon__logo balloon__logo--left" id="logo-left-el" viewBox="0 0 870.19 1347.8" hidden>
                    <use href="#logo-left"></use>
                  </svg>
                  <svg class="balloon__logo balloon__logo--right" id="logo-right-el" viewBox="0 0 529.14 750.33" hidden>
                    <use href="#logo-right"></use>
                  </svg>
                </div>
              </div>
              <div class="balloon__knot"></div>
              <svg class="balloon__string" viewBox="0 0 40 150" aria-hidden="true">
                <path id="string-path"
                  d="M20 0 C6 18 34 30 20 44 C6 58 34 70 20 84 C8 96 30 108 22 122 C18 130 24 140 30 148" fill="none"
                  stroke="var(--string-color, #20201f)" stroke-width="2.5" stroke-linecap="round" />
              </svg>
            </div>
          </div>
          <div class="calc__caption">
            <div class="calc__caption-label">Цвет шара</div>
            <div class="calc__caption-name" id="shar-name">Прозрачный</div>
          </div>
        </div>

        <!-- Управление -->
        <div class="calc__controls">
          <section class="calc__section">
            <div class="calc__section-title">Цвет шара</div>
            <div class="calc__swatches" id="shar-swatches"></div>
          </section>

          <section class="calc__section">
            <div class="calc__section-title">Количество сторон и цветов</div>
            <select class="calc__select" id="opt-select"></select>
            <div class="calc__toggle" id="same-toggle" hidden>
              <button type="button" class="calc__toggle-btn" id="same-true">Одинаковые с 2-х сторон</button>
              <button type="button" class="calc__toggle-btn" id="same-false">Разные с 2-х сторон</button>
            </div>
          </section>

          <section class="calc__section">
            <div class="calc__section-title">Цвет логотипа</div>
            <div class="calc__color-rows" id="colors-a"></div>
            <div class="calc__side-b" id="side-b" hidden>
              <div class="calc__section-title">Цвет второго логотипа</div>
              <div class="calc__color-rows" id="colors-b"></div>
            </div>
          </section>

          <section class="calc__qty-row">
            <div class="calc__qty">
              <div class="calc__section-title">Тираж, шт.</div>
              <select class="calc__select calc__select--qty" id="qty-select"></select>
            </div>
            <div class="calc__total">
              <div class="calc__total-label">Итого</div>
              <div class="calc__total-main">
                <span class="calc__total-value" id="total-value">—</span>
                <span class="calc__total-cur">руб.</span>
              </div>
              <div class="calc__total-per" id="total-per"></div>
            </div>
          </section>

          <button type="button" class="calc__order-btn" id="order-btn">Заказать</button>
        </div>
      </div>

      <!-- ===== Форма заказа ===== -->
      <div class="order-form" id="order-form-card" hidden>
        <form class="order-form__form" id="order-form">
          <h2 class="order-form__title">Ваш заказ</h2>
          <div class="order-form__grid">
            <div class="order-form__summary">
              <div class="order-form__summary-head">Цвет шара</div>
              <div class="order-form__summary-head">Печать</div>
              <div class="order-form__summary-head">Цвета логотипа</div>
              <div class="order-form__summary-head">Тираж</div>
              <div class="order-form__summary-shar">
                <span class="order-form__dot order-form__dot--shar" id="summary-shar-dot"></span>
                <b class="order-form__summary-name" id="summary-shar-name"></b>
              </div>
              <div class="order-form__summary-cell" id="summary-opt"></div>
              <div class="order-form__summary-colors" id="summary-colors"></div>
              <div class="order-form__summary-cell" id="summary-qty"></div>
              <div class="order-form__summary-total">Итого: <b id="summary-total"></b></div>
            </div>
            <div class="order-form__field">
              <label class="order-form__label" for="f-name">Ваше имя</label>
              <input class="order-form__input" id="f-name" name="name">
            </div>
            <div class="order-form__field">
              <label class="order-form__label" for="f-phone">Телефон</label>
              <input class="order-form__input" id="f-phone" name="phone" required>
            </div>
            <div class="order-form__field">
              <label class="order-form__label" for="f-email">E-mail</label>
              <input class="order-form__input" id="f-email" name="email" type="email">
            </div>
            <div class="order-form__field order-form__field--full">
              <label class="order-form__label" for="f-msg">Сообщение</label>
              <textarea class="order-form__input" id="f-msg" name="msg" rows="3"></textarea>
            </div>
          </div>
          <button type="submit" class="order-form__submit" id="submit-btn">Отправить</button>
        </form>

        <div class="order-form__thanks" id="thanks" hidden>
          <div class="order-form__thanks-title">Спасибо, заявка отправлена!</div>
          <div class="order-form__thanks-sub">Мы свяжемся с вами в ближайшее время.</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Логотипы: инлайн-symbol, перекраска частей через CSS-переменные -->
  <svg xmlns="http://www.w3.org/2000/svg" class="logo-defs" aria-hidden="true">
